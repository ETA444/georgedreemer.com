# Paste into seo/htaccess (generated by build-llms.py)
<IfModule mod_mime.c>
    AddType text/markdown .md
    AddCharset UTF-8 .md .txt
</IfModule>
<IfModule mod_deflate.c>
    AddOutputFilterByType DEFLATE text/markdown
</IfModule>
<IfModule mod_headers.c>
    <Files "index.md">
        Header set Link "<https://georgedreemer.com/>; rel=\"canonical\", <https://georgedreemer.com/llms.txt>; rel=\"describedby\""
    </Files>
    <Files "bachelors.md">
        Header set Link "<https://georgedreemer.com/education/bachelors>; rel=\"canonical\", <https://georgedreemer.com/llms.txt>; rel=\"describedby\""
    </Files>
    <Files "masters.md">
        Header set Link "<https://georgedreemer.com/education/masters>; rel=\"canonical\", <https://georgedreemer.com/llms.txt>; rel=\"describedby\""
    </Files>
    <Files "cryptopandemic.md">
        Header set Link "<https://georgedreemer.com/work/cryptopandemic>; rel=\"canonical\", <https://georgedreemer.com/llms.txt>; rel=\"describedby\""
    </Files>
    <Files "datasafari.md">
        Header set Link "<https://georgedreemer.com/work/datasafari>; rel=\"canonical\", <https://georgedreemer.com/llms.txt>; rel=\"describedby\""
    </Files>
    <Files "dreemcorp.md">
